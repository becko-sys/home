<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моят красив уебсайт</title>
    <style>
        /* Основна настройка на страницата */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Красива централна карта за съдържанието */
        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        /* Заглавие */
        h1 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 2rem;
        }

        /* Текст */
        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        /* Модерен бутон */
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        /* Ефект при посочване на бутона с мишката */
        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Добре дошли в моя сайт</h1>
        <p>Това е изчистен, модерен и красив дизайн, създаден изцяло с HTML и CSS. Страницата изглежда страхотно както на компютър, така и на телефон.</p>
        <a href="#" class="btn">Научи повече</a>
    </div>

</body>
</html>
